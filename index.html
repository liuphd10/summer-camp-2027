<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>2027 夏令營報名追蹤</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#636c76; --line:#e4e1d9;
    --accent:#2f5d50; --warn:#b4532a; --warnbg:#fbeee6; --ok:#2f6f3e; --okbg:#e8f3ea;
    --tbd:#7a6a2b; --tbdbg:#f7f0d6; --blue:#2c5282; --bluebg:#e6eef8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
  header h1{margin:0 0 4px;font-size:28px;letter-spacing:.5px}
  header p{margin:0;color:var(--muted);font-size:14px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:13px;color:var(--muted)}
  h2{font-size:18px;margin:34px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:inline-block}
  /* timeline */
  .timeline{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tl-row{display:grid;grid-template-columns:120px 92px 1fr auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);font-size:14px}
  .tl-row:first-child{border-top:none}
  .tl-row.past{opacity:.45}
  .tl-date{font-weight:700;font-variant-numeric:tabular-nums}
  .tl-camp{font-weight:500;color:var(--accent)}
  .tl-left{font-size:12px;color:var(--muted);white-space:nowrap}
  .tl-left.soon{color:var(--warn);font-weight:700}
  /* cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px;display:flex;flex-direction:column}
  .card h3{margin:0;font-size:20px}
  .card .sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
  .status{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin-bottom:12px}
  .s-open{background:var(--okbg);color:var(--ok)}
  .s-soon{background:var(--bluebg);color:var(--blue)}
  .s-tbd{background:var(--tbdbg);color:var(--tbd)}
  dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:8px 10px;font-size:14px}
  dt{color:var(--muted);font-weight:500}
  dd{margin:0}
  dd.key{font-weight:700}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:1px;font-weight:500}
  .t-off{background:var(--okbg);color:var(--ok)}
  .t-3rd{background:var(--bluebg);color:var(--blue)}
  .t-prev{background:var(--tbdbg);color:var(--tbd)}
  .note{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--warnbg);color:#6b3416;font-size:13px}
  .links{margin-top:auto;padding-top:12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px}
  .links a{color:var(--accent)}
  .legend{font-size:12px;color:var(--muted);margin-top:8px}
  .log{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px}
  .log li{margin:4px 0}
  footer{margin-top:30px;font-size:12px;color:var(--muted)}
  @media (max-width:640px){
    .tl-row{grid-template-columns:96px 1fr;}
    .tl-row .tl-camp{grid-column:2}
    .tl-row .tl-what{grid-column:1 / -1}
    .tl-row .tl-left{grid-column:1 / -1}
  }

  .vbar{background:#1f2328;color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:22px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .vbar b{font-size:15px}
  .vbar a{color:#cfe3dc}
  .intro{margin:-4px 0 14px;color:var(--muted);font-size:14px}
  .legend2{font-size:13px;color:var(--muted);margin-top:10px;line-height:2}
  .cert{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
  .c-off{background:var(--okbg);color:var(--ok)}
  .c-3rd{background:var(--bluebg);color:var(--blue)}
  .c-prev{background:var(--tbdbg);color:var(--tbd)}
  .type{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;border:1px solid currentColor}
  .ty-open{color:#2f6f3e}.ty-early{color:#8a5a00}.ty-deadline{color:#b4532a}.ty-start{color:#2c5282}.ty-refund{color:#6b4c9a}
  .camp-CTY{--cc:#2c5282}.camp-MathPath{--cc:#6b4c9a}.camp-Duke{--cc:#1f7a6d}
  .cpill{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--cc);padding:2px 9px;border-radius:999px;white-space:nowrap}
  .is-past{opacity:.45}

  .bycamp{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .col{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .col-h{background:var(--cc);color:#fff;padding:12px 16px}
  .col-h h3{margin:0;font-size:20px}
  .col-h .nx{font-size:13px;opacity:.9}
  .steps{list-style:none;margin:0;padding:8px 16px 14px;position:relative}
  .step{position:relative;padding:12px 0 12px 26px;border-left:2px solid var(--line);margin-left:6px}
  .step:last-child{border-left-color:transparent}
  .step::before{content:"";position:absolute;left:-8px;top:16px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--cc)}
  .step .d{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .step .w{margin:4px 0;font-size:14px}
  .step .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  .step .m .soon{color:var(--warn);font-weight:700}
  .more{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .more-g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .more-g h3{margin:0 0 8px;font-size:16px}
  .more-g ul{margin:0;padding:0;list-style:none}
  .more-g li{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
  .more-g li:first-child{border-top:none}
  .more-g a{color:var(--accent);font-weight:500}
  .more-g small{display:block;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2027 夏令營報名追蹤</h1>
    <p>CTY · MathPath · Duke：適合 12 歲孩子的報名時程、費用與資格</p>
    <div class="meta">
      <span>最後查核：<strong id="lastChecked"></strong></span>
      <span>每週自動重查官網</span>
      <span>今天：<strong id="today"></strong></span>
    </div>
  </header>

  <h2>重要日期</h2>
  <p class="intro">每個營隊從開放報名到開營的步驟，由上往下依時間排列。</p>
  <div class="bycamp" id="timeline"></div>
  <div class="legend2">
    <b>怎麼看：</b>
    <span class="cert c-off">已確定</span> 官網已公布
    <span class="cert c-3rd">預估</span> 其他網站整理，官網還沒公布
    <span class="cert c-prev">暫用去年</span> 2027 還沒公布，先放 2026 年的日期
  </div>

  <h2>營隊明細</h2>
  <div class="cards" id="cards"></div>
  <div class="legend">
    資料來源標籤：<span class="tag t-off">官方</span> 營隊官網
    <span class="tag t-3rd">第三方</span> 升學網站轉述，官網尚未確認
    <span class="tag t-prev">參考去年</span> 2027 尚未公布，暫列 2026 數據
  </div>

  <h2>更多營隊</h2>
  <p class="intro" id="moreIntro"></p>
  <div class="more" id="more"></div>

  <h2>更新紀錄</h2>
  <div class="log"><ul id="log"></ul></div>

  <footer>金額為美元。所有資訊請在報名前到官網再確認一次。</footer>
</div>

      status:"tbd", statusText:"2027 申請資料尚未公布（官網原說 11 月公布）",
      rows:[
        ["開放報名","尚未公布。官網表示預計 2026 年 11 月公布 2027 申請資料","off",true],
        ["報名截止","尚未公布。2026 年截止日為 4/12","prev",true],
        ["早鳥優惠","2026 年：2/28 前全額付清折 $200；4/15 前全額付清折 $100","prev"],
        ["活動日期","尚未公布。2026 年為 6/28–7/26（四週）","prev"],

        ["名額","不公布，需通過資格考題（Qualifying Test）"],
        ["資格","開營前滿 11 歲，營隊結束前未滿 15 歲。12 歲符合"]
      ],
      note:"申請須完成資格考題（Qualifying Test），需要花時間解題。申請資料一公布就可以開始準備。",

    },
    {
      name:"Duke", full:"Duke University Pre-College（原 Continuing Studies 夏季營隊，給 6–12 年級）",
      status:"soon", statusText:"預計 2026 年 12 月開放報名",

        ["開放報名","2026 年 12 月。官網說正在更換付款系統，所以延後開放；可先填資料表，開放時會寄信通知","off",true],

        ["費用","住宿 $6,300；走讀 $4,550（只有初中組有走讀）。疫苗費約 $150–$250 另計。不提供個人獎學金","off"],

        ["名額","官網未公布",null],
        ["資格","現讀 6–8 年級，至少讀完一年初中；開課時滿 11 歲；GPA 3.0 以上。住宿要開課時滿 13 歲","off"]
      ],
      note:"12 歲如果開課前還沒滿 13 歲，只能選走讀（早上 8:30 送到、下午 5:00 接回），所以家裡要住在 Durham 附近。2027 年沒有線上課程。初中組每梯次有 6 門課，例如 Mock Trial、Forensic Science、Engineering 101、Creative Writing。",
      links:[["Duke Pre-College 官網","https://provost.duke.edu/pre-college-programs/"],["初中組課程","https://provost.duke.edu/programs-initiatives/duke-pre-college-programs/duke-pre-college-middle-school-courses/"]]

  ],

        ["VAMPY（Western Kentucky University）","https://www.wku.edu/gifted/vampy/index.php","讀完 7–10 年級"]

const SRC = {off:['官方','t-off'],'3rd':['第三方','t-3rd'],prev:['參考去年','t-prev']};
const tag = s => s && SRC[s] ? `<span class="tag ${SRC[s][1]}">${SRC[s][0]}</span>` : '';
const today = new Date(); today.setHours(0,0,0,0);
const fmt = d => `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
document.getElementById('today').textContent = fmt(today);
document.getElementById('lastChecked').textContent = DATA.lastChecked.replace(/-/g,'/');


const TYPES = {open:['開放報名','ty-open'], early:['早鳥優惠','ty-early'], deadline:['報名截止','ty-deadline'], start:['營隊開始','ty-start'], refund:['退費期限','ty-refund']};
const typeOf = w => /開放報名/.test(w) ? 'open' : /折|早鳥/.test(w) ? 'early' : /退費/.test(w) ? 'refund' : /截止/.test(w) ? 'deadline' : 'start';
const CERT = {off:['已確定','c-off'],'3rd':['預估','c-3rd'],prev:['暫用去年','c-prev']};
const cert = s => CERT[s] ? `<span class="cert ${CERT[s][1]}">${CERT[s][0]}</span>` : '';
const typeTag = t => `<span class="type ${TYPES[t][1]}">${TYPES[t][0]}</span>`;
const EVENTS = DATA.timeline.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{
  const d = new Date(e.date+'T00:00:00');
  const days = Math.round((d - today)/86400000);
  return {...e, d, days, type: e.type || typeOf(e.what), label: e.approx ? `${d.getFullYear()} 年 ${e.approx}` : `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`,
    past: days < 0 && !e.approx,
    left: e.approx && days < 0 ? '即將開始' : days < 0 ? '已過' : days === 0 ? '就是今天' : `還有 ${days} 天`};
});

const tl = document.getElementById('timeline');
DATA.camps.forEach(c=>{
  const evs = EVENTS.filter(e=>e.camp===c.name);
  const next = evs.find(e=>!e.past);
  const col = document.createElement('div');
  col.className = 'col camp-'+c.name;
  col.innerHTML = `<div class="col-h"><h3>${c.name}</h3><div class="nx">下一步：${next ? next.label+' '+TYPES[next.type][0] : '無'}</div></div>
    <ol class="steps">${evs.map(e=>`<li class="step ${e.past?'is-past':''}">
      <div class="d">${e.label}</div>
      <div class="w">${e.what}</div>
      <div class="m">${typeTag(e.type)} ${cert(e.src)} <span class="${e.days>=0&&e.days<=30?'soon':''}">${e.left}</span></div>
    </li>`).join('')}</ol>`;
  tl.appendChild(col);
});

// cards
const cards = document.getElementById('cards');
DATA.camps.forEach(c=>{
  const el = document.createElement('div'); el.className='card';
  const cls = c.status==='open'?'s-open':c.status==='soon'?'s-soon':'s-tbd';
  el.innerHTML = `<h3>${c.name}</h3><div class="sub">${c.full}</div>
    <div><span class="status ${cls}">${c.statusText}</span></div>
    <dl>${c.rows.map(r=>`<dt>${r[0]}</dt><dd class="${r[3]?'key':''}">${r[1]} ${tag(r[2])}</dd>`).join('')}</dl>
    ${c.note?`<div class="note">${c.note}</div>`:''}
    <div class="links">${c.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('')}</div>`;
  cards.appendChild(el);
});

// more programs
const M = DATA.more;
document.getElementById('moreIntro').innerHTML = `以下挑自 <a href="${M.source[1]}" target="_blank" rel="noopener">${M.source[0]} ↗</a> 裡適合 12 歲左右的營隊。這份清單是家長和專業人士推薦整理，Davidson 不背書；文章刊於 2023 年，報名前請到各營隊官網確認 2027 年的資訊。`;
document.getElementById('more').innerHTML = M.groups.map(g=>`<div class="more-g"><h3>${g.topic}</h3><ul>${g.items.map(i=>`<li><a href="${i[1]}" target="_blank" rel="noopener">${i[0]} ↗</a><small>${i[2]}</small></li>`).join('')}</ul></div>`).join('');

// log
document.getElementById('log').innerHTML = DATA.log.slice().reverse().map(x=>`<li>${x}</li>`).join('');
</script>
</body>
