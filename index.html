<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 夏令營報名追蹤</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#636c76; --line:#e4e1d9;
    --accent:#2f5d50; --warn:#b4532a; --warnbg:#fbeee6; --ok:#2f6f3e; --okbg:#e8f3ea;
    --tbd:#7a6a2b; --tbdbg:#f7f0d6; --blue:#2c5282; --bluebg:#e6eef8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
  header h1{margin:0 0 4px;font-size:28px;letter-spacing:.5px}
  header p{margin:0;color:var(--muted);font-size:14px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:13px;color:var(--muted)}
  h2{font-size:18px;margin:34px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:inline-block}
  /* timeline */
  .timeline{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tl-row{display:grid;grid-template-columns:120px 92px 1fr auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);font-size:14px}
  .tl-row:first-child{border-top:none}
  .tl-row.past{opacity:.45}
  .tl-date{font-weight:700;font-variant-numeric:tabular-nums}
  .tl-camp{font-weight:500;color:var(--accent)}
  .tl-left{font-size:12px;color:var(--muted);white-space:nowrap}
  .tl-left.soon{color:var(--warn);font-weight:700}
  /* cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px;display:flex;flex-direction:column}
  .card h3{margin:0;font-size:20px}
  .card .sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
  .status{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin-bottom:12px}
  .s-open{background:var(--okbg);color:var(--ok)}
  .s-soon{background:var(--bluebg);color:var(--blue)}
  .s-tbd{background:var(--tbdbg);color:var(--tbd)}
  dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:8px 10px;font-size:14px}
  dt{color:var(--muted);font-weight:500}
  dd{margin:0}
  dd.key{font-weight:700}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:1px;font-weight:500}
  .t-off{background:var(--okbg);color:var(--ok)}
  .t-3rd{background:var(--bluebg);color:var(--blue)}
  .t-prev{background:var(--tbdbg);color:var(--tbd)}
  .note{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--warnbg);color:#6b3416;font-size:13px}
  .links{margin-top:auto;padding-top:12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px}
  .links a{color:var(--accent)}
  .legend{font-size:12px;color:var(--muted);margin-top:8px}
  .log{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px}
  .log li{margin:4px 0}
  footer{margin-top:30px;font-size:12px;color:var(--muted)}
  @media (max-width:640px){
    .tl-row{grid-template-columns:96px 1fr;}
    .tl-row .tl-camp{grid-column:2}
    .tl-row .tl-what{grid-column:1 / -1}
    .tl-row .tl-left{grid-column:1 / -1}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2027 夏令營報名追蹤</h1>
    <p>CTY · MathPath · TANG：適合 12 歲孩子的報名時程、費用與資格</p>
    <div class="meta">
      <span>最後查核：<strong id="lastChecked"></strong></span>
      <span>每週自動重查官網</span>
      <span>今天：<strong id="today"></strong></span>
    </div>
  </header>

  <h2>重要日期時間軸</h2>
  <div class="timeline" id="timeline"></div>
  <div class="legend">標示「參考去年」的日期是 2026 年的時程，2027 年公布後會更新。灰色是已過的日期。</div>

  <h2>營隊明細</h2>
  <div class="cards" id="cards"></div>
  <div class="legend">
    資料來源標籤：<span class="tag t-off">官方</span> 營隊官網
    <span class="tag t-3rd">第三方</span> 升學網站轉述，官網尚未確認
    <span class="tag t-prev">參考去年</span> 2027 尚未公布，暫列 2026 數據
  </div>

  <h2>更新紀錄</h2>
  <div class="log"><ul id="log"></ul></div>

  <footer>金額為美元。所有資訊請在報名前到官網再確認一次。</footer>
</div>

<script>
const DATA = {
  lastChecked: "2026-11-22",
  log: [
    "2026-11-22　建立頁面。CTY 2027 時程來自第三方整理（官網尚未上線）；MathPath 2027 申請資料尚未公布；TANG 2027 已公布日期 7/1–7/5，報名尚未開放。"
  ],
  // 時間軸項目：date (YYYY-MM-DD)、camp、what、src: off | 3rd | prev
  timeline: [
    {date:"2026-12-01", approx:"12 月初", camp:"CTY", what:"2027 夏季課程開放報名", src:"3rd"},
    {date:"2027-02-28", camp:"MathPath", what:"全額付清折 $200（早鳥第一階段）", src:"prev"},
    {date:"2027-04-10", camp:"TANG", what:"早鳥報名截止（住宿方案省 $50）", src:"prev"},
    {date:"2027-04-12", camp:"MathPath", what:"申請截止", src:"prev"},
    {date:"2027-04-15", camp:"MathPath", what:"全額付清折 $100（早鳥第二階段）", src:"prev"},
    {date:"2027-05-10", camp:"CTY", what:"Summer A 報名截止", src:"3rd"},
    {date:"2027-05-29", camp:"TANG", what:"一般報名截止", src:"prev"},
    {date:"2027-05-31", camp:"MathPath", what:"取消可幾乎全額退費的期限", src:"prev"},
    {date:"2027-06-07", camp:"CTY", what:"Summer B 報名截止", src:"3rd"},
    {date:"2027-06-12", camp:"TANG", what:"住宿方案逾期報名截止", src:"prev"},
    {date:"2027-06-27", camp:"CTY", what:"Summer A 開課（6/27–7/16）", src:"3rd"},
    {date:"2027-07-01", camp:"TANG", what:"營隊開始（7/1–7/5）", src:"off"},
    {date:"2027-07-18", camp:"CTY", what:"Summer B 開課（7/18–8/6）", src:"3rd"}
  ],
  camps: [
    {
      name:"CTY", full:"Johns Hopkins Center for Talented Youth（約翰霍普金斯資優青少年中心）",
      status:"soon", statusText:"預計 2026 年 12 月初開放報名",
      rows:[
        ["開放報名","2026 年 12 月初","3rd",true],
        ["報名截止","Summer A：2027/5/10<br>Summer B：2027/6/7","3rd",true],
        ["早鳥優惠","沒有早鳥價。熱門課程和校區會先額滿，建議開放後盡早報名","3rd"],
        ["活動日期","Summer A：6/27–7/16<br>Summer B：7/18–8/6（暫定，各校區可能不同）","3rd"],
        ["費用","依課程而定。2025 年住宿/走讀課程為 $3,149–$7,501；另有入會費 $55、報名費 $75","prev"],
        ["地點","美國多個中學和大學校園，例如 Johns Hopkins University（巴爾的摩）。住宿課程：部分校區收 5 年級以上，全部校區收 7 年級以上","off"],
        ["名額","每班約 12–18 人，不公布總名額","3rd"],
        ["資格","須先取得 CTY 資格：標準化測驗達第 98 百分位以上，或參加 CTY 自辦測驗"]
      ],
      note:"12 歲通常是 6 或 7 年級：6 年級只能選開放 5 年級住宿的校區，7 年級可選全部校區。資格測驗要時間，建議現在就準備。",
      links:[["CTY 學術行事曆","https://cty.jhu.edu/cty-experience/academic-calendar"],["學費與補助","https://cty.jhu.edu/programs/summer/tuition-and-financial-aid"],["住宿課程","https://cty.jhu.edu/cty-experience/residential"]]
    },
    {
      name:"MathPath", full:"給 11–14 歲學生的四週住宿數學營",
      status:"tbd", statusText:"2027 申請資料尚未公布（官網原說 11 月公布）",
      rows:[
        ["開放報名","尚未公布。官網表示預計 2026 年 11 月公布 2027 申請資料","off",true],
        ["報名截止","尚未公布。2026 年截止日為 4/12","prev",true],
        ["早鳥優惠","2026 年：2/28 前全額付清折 $200；4/15 前全額付清折 $100","prev"],
        ["活動日期","尚未公布。2026 年為 6/28–7/26（四週）","prev"],
        ["費用","2026 年為 $6,600，可申請補助","prev"],
        ["地點","每年更換校園，2027 尚未公布（2026 年在奧勒岡州的 University of Portland）","prev"],
        ["名額","不公布，需通過資格考題（Qualifying Test）"],
        ["資格","開營前滿 11 歲，營隊結束前未滿 15 歲。12 歲符合"]
      ],
      note:"申請須完成資格考題（Qualifying Test），需要花時間解題。申請資料一公布就可以開始準備。",
      links:[["MathPath 官網","https://www.mathpath.org/"],["申請方式","https://www.mathpath.org/apply/applynow/returning"],["學費與補助","https://www.mathpath.org/apply/financialaidtuition"]]
    },
    {
      name:"TANG", full:"Taiwanese American Next Generation（台美下一代夏令營，家庭共同參加）",
      status:"tbd", statusText:"2027 日期已公布，報名尚未開放",
      rows:[
        ["開放報名","尚未公布",null,true],
        ["報名截止","尚未公布。2026 年：早鳥 4/10、一般 5/29、逾期 6/12（住宿）；走讀一般 5/29、逾期 6/20","prev",true],
        ["早鳥優惠","2026 年早鳥價比一般價便宜 $50；第一次參加的家庭另折 $50","prev"],
        ["活動日期","2027/7/1–7/5（五天四夜）","off"],
        ["費用","2026 年住宿方案（早鳥/一般/逾期）：Junior High $320 / $370 / $420；家長 $460 / $510 / $560；寢具包 $22","prev"],
        ["地點","官網未明列。2026 年的貼文提到 WCU（賓州 West Chester University）","prev"],
        ["名額","各組有上限，先到先得，額滿候補","off"],
        ["資格","Junior High 組為 6–8 年級，依營隊前最後完成的年級分組"]
      ],
      note:"未滿 18 歲須由已報名的家長、監護人或 21 歲以上成人陪同，所以至少需要一位大人一起報名。Junior High 組不提供走讀。",
      links:[["TANG 報名頁","https://www.tangeneration.org/registration"],["TANG 官網","https://www.tangeneration.org/"]]
    }
  ]
};

const SRC = {off:['官方','t-off'],'3rd':['第三方','t-3rd'],prev:['參考去年','t-prev']};
const tag = s => s && SRC[s] ? `<span class="tag ${SRC[s][1]}">${SRC[s][0]}</span>` : '';
const today = new Date(); today.setHours(0,0,0,0);
const fmt = d => `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
document.getElementById('today').textContent = fmt(today);
document.getElementById('lastChecked').textContent = DATA.lastChecked.replace(/-/g,'/');

// timeline
const tl = document.getElementById('timeline');
DATA.timeline.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
  const d = new Date(e.date+'T00:00:00');
  const days = Math.round((d - today)/86400000);
  const label = e.approx ? e.approx : fmt(d);
  let left = days<0 ? '已過' : days===0 ? '今天' : `還有 ${days} 天`;
  const row = document.createElement('div');
  row.className = 'tl-row' + (days<0 && !e.approx ? ' past':'');
  row.innerHTML = `<div class="tl-date">${label}</div><div class="tl-camp">${e.camp}</div>
    <div class="tl-what">${e.what} ${tag(e.src)}</div>
    <div class="tl-left ${days>=0 && days<=30 ? 'soon':''}">${e.approx && days<0 ? '即將開放' : left}</div>`;
  tl.appendChild(row);
});

// cards
const cards = document.getElementById('cards');
DATA.camps.forEach(c=>{
  const el = document.createElement('div'); el.className='card';
  const cls = c.status==='open'?'s-open':c.status==='soon'?'s-soon':'s-tbd';
  el.innerHTML = `<h3>${c.name}</h3><div class="sub">${c.full}</div>
    <div><span class="status ${cls}">${c.statusText}</span></div>
    <dl>${c.rows.map(r=>`<dt>${r[0]}</dt><dd class="${r[3]?'key':''}">${r[1]} ${tag(r[2])}</dd>`).join('')}</dl>
    ${c.note?`<div class="note">${c.note}</div>`:''}
    <div class="links">${c.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('')}</div>`;
  cards.appendChild(el);
});

// log
document.getElementById('log').innerHTML = DATA.log.slice().reverse().map(x=>`<li>${x}</li>`).join('');
</script>
</body>
</html>
